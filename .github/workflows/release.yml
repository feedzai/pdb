name: Release PDB to Maven Central

# Publishes a release every time a version tag (x.y.z) is pushed.
# The version is derived from the tag by jgitver (see .mvn/jgitver.config.xml).
#
# It can also be started by hand from the Actions tab on a branch: that is a dry run which imports the key,
# builds and signs the jars, but uploads nothing to Maven Central.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # jgitver needs the full history and tags to compute the version

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'zulu'
          cache: maven
          # Writes the Central Portal credentials for server "central" in settings.xml
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          # Imports the signing key into the runner's keyring
          gpg-private-key: ${{ secrets.PGP_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # jgitver only treats annotated tags as release versions. A tag created in the GitHub UI (Releases)
      # is lightweight and would give "<version>-SNAPSHOT", so annotate it (locally, on the runner only).
      - name: Annotate the release tag
        if: github.ref_type == 'tag'
        run: |
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag -f -a "$GITHUB_REF_NAME" -m "Release $GITHUB_REF_NAME" "$GITHUB_REF_NAME^{commit}"

      - name: Check that the Maven version matches the tag
        if: github.ref_type == 'tag'
        run: |
          version=$(mvn -B -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          echo "Maven version: $version, tag: $GITHUB_REF_NAME"
          test "$version" = "$GITHUB_REF_NAME"

      # Tests run in the PR workflows. JDK 8 keeps the Java 8 bytecode of previous PDB releases.
      - name: Publish to Maven Central
        if: github.ref_type == 'tag'
        run: mvn -B -ntp deploy -Prelease -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USER }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASS }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.PGP_PASS }}

      # Same build and signing as a release, but nothing is sent to Central (skipPublishing).
      - name: Dry run (sign and bundle, nothing is uploaded)
        if: github.ref_type != 'tag'
        run: |
          mvn -B -ntp deploy -Prelease -DskipTests -DskipPublishing=true
          ls -l target/*.jar target/*.asc
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.PGP_PASS }}
